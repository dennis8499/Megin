name: Megin Skills portability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".agents/skills/**"
      - "README.md"
      - "OPERATIONS.md"
      - "VERSION"
      - "megin-skills.zip"
      - ".github/workflows/knowledge-portability.yml"
      - ".gitattributes"
      - ".gitignore"
      - "tests/quality-gates/**"

jobs:
  skills:
    name: Validate Skills bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate Skills source and distributable archive
        run: python -X utf8 -B .agents/skills/megin/scripts/validate_skills.py --archive megin-skills.zip
      - name: Check pull-request whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$PR_BASE_SHA...$GITHUB_SHA"
          else
            git diff --check "$GITHUB_SHA^" "$GITHUB_SHA"
          fi

  platform:
    name: Validate on ${{ matrix.os_name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: linux
            runner: ubuntu-latest
          - os_name: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check out the fixed reviewer integration-test dependency
        uses: actions/checkout@v4
        with:
          repository: dennis8499/MergeReviewer
          ref: fc08cf5706334264f289633aa80ed6ee34a09911
          path: .test-dependencies/merge-reviewer
          persist-credentials: false
      - name: Check runtime prerequisites
        run: |
          python --version
          git --version
      - name: Validate Skills source and distributable archive
        run: python -X utf8 -B .agents/skills/megin/scripts/validate_skills.py --archive megin-skills.zip
      - name: Validate legacy and native Repo/Group workflows
        env:
          MEGIN_TEST_MERGE_REVIEWER_SCRIPTS: ${{ github.workspace }}/.test-dependencies/merge-reviewer/skills/merge-reviewer/scripts
        run: python -X utf8 -B -m unittest discover -s tests/quality-gates -p "test_*.py" -v
